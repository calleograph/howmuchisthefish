server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Проксирование на backend прямо здесь (не только в Caddyfile) — чтобы
    # /api работал даже без внешнего reverse-proxy: режим external-proxy
    # рассчитан на то, что proxy организации сам разделит пути, но если
    # администратор просто открыл порт фронтенда напрямую (без proxy вообще),
    # запросы /api иначе падали в SPA-fallback ниже и получали 405 на POST
    # (try_files не отдаёт index.html на не-GET методы) — найдено реальным
    # тестированием входа через браузер. "backend" — DNS-имя сервиса в сети
    # docker compose, доступно в обоих режимах публикации.
    location /api/ {
        # Дефолт nginx (1 МБ) меньше лимита backend (useBodyParser, 10 МБ,
        # см. backend/src/main.ts) — клонированный граббером htmlSource
        # реального сайта легко превышает 1 МБ и падал здесь 413 раньше,
        # чем запрос вообще доходил до backend (найдено живым тестом:
        # фикс лимита в NestJS сам по себе не помог).
        client_max_body_size 10m;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://backend:3000;
    }
    location /lp/ {
        proxy_pass http://backend:3000;
    }
    location /t/ {
        proxy_pass http://backend:3000;
    }

    # SPA fallback: любой путь, не найденный как файл, отдаёт index.html —
    # иначе прямой переход на /campaigns внутри контейнера фронтенда (не через
    # reverse proxy с /api-разделением) дал бы 404 вместо React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Долгое кэширование для хэшированных ассетов (Vite добавляет content-hash
    # в имя файла — безопасно кэшировать агрессивно, на новый деплой имя сменится).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
